# Serve self-hosted .pmtiles from a VPS. The ONE gotcha that silently breaks
# MapLibre (blank map, no error): the origin must support HTTP byte-range AND
# send CORS Range headers. nginx serves ranges for static files by default —
# you mainly need the CORS headers below.
#
# Health check (must return 206 + "Content-Range"):
#   curl -sI -H 'Range: bytes=0-0' https://YOUR_HOST/region.pmtiles

server {
    listen 443 ssl http2;
    server_name maps.example.com;

    # ssl_certificate     /etc/letsencrypt/live/maps.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/maps.example.com/privkey.pem;

    root /srv/maps;

    location ~* \.pmtiles$ {
        add_header Access-Control-Allow-Origin  "*"                 always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range"             always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;
        add_header Accept-Ranges bytes always;

        if ($request_method = OPTIONS) { return 204; }
    }
}

# Note: Cloudflare R2 handles byte-range + CORS natively (and zero egress),
# so it's the lower-risk default for a public map. Use this nginx config when
# self-hosting on the VPS is preferred.
