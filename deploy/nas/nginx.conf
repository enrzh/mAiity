server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Style packs (own mount — can't nest a mount inside the ro dist mount).
    location /maps/packs/ {
        alias /packs-data/;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Existing styles use the z15 filename; the NAS stores the same region
    # archive under the stable filename region.pmtiles.
    location = /maps/region-z15.pmtiles {
        alias /usr/share/nginx/html/maps/region.pmtiles;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Accept-Ranges bytes always;
    }

    # The whole app lives under /maps/ (built with base=/maps/).
    # Use an explicit alias: the VPS forwards the /maps prefix unchanged.
    location = /maps/ {
        rewrite ^ /maps/index.html last;
    }
    location /maps/ {
        alias /usr/share/nginx/html/maps/;
        index index.html;
        # PMTiles needs byte-range + CORS Range, or MapLibre shows a blank map.
        # Same-origin in production; the wildcard also lets local dev pull tiles.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Accept-Ranges bytes always;
        if ($request_method = OPTIONS) { return 204; }

        try_files $uri =404;
    }
}
