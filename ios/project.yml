name: MapsApp
options:
  bundleIdPrefix: de.aiity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    exactVersion: 0.25.0
targets:
  MapsApp:
    type: application
    platform: iOS
    sources:
      - path: MapsApp
    dependencies:
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftDSL
    info:
      path: MapsApp/Info.plist
      properties:
        CFBundleDisplayName: mAiity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Zeigt deine Position auf der Karte. Standort wird nur lokal verwendet.
    entitlements:
      path: MapsApp/MapsApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.aiity.maps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
